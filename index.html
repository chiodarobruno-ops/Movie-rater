<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Rater</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #faf8f5;
            --text-color: #2d332e;
            --text-muted: #737a74;
            --surface-color: #ffffff;
            --border-color: #e6e2da;
            --accent-color: #7b9e87;
            --accent-hover: #658570;
            --star-color: #e0ac69;
            --danger-color: #c46d5e;
            --header-bg: rgba(250, 248, 245, 0.95);
            --btn-text: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --radius: 8px;
        }

        [data-theme="dark"] {
            --bg-color: #1a1e1a;
            --text-color: #e8e6e1;
            --text-muted: #9ba39b;
            --surface-color: #222722;
            --border-color: #333a33;
            --accent-color: #8eb69b;
            --accent-hover: #a1c7ad;
            --btn-text: #1a1e1a;
            --header-bg: rgba(26, 30, 26, 0.95);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
            -webkit-font-smoothing: antialiased;
        }

        /* Utility */
        .hidden { display: none !important; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        img { max-width: 100%; display: block; border-radius: var(--radius); }
        button { font-family: inherit; cursor: pointer; border: none; background: none; transition: 0.2s; }
        
        /* Typography */
        h1, h2, h3 { font-weight: 600; line-height: 1.2; }
        p { color: var(--text-color); }
        .text-muted { color: var(--text-muted); font-size: 0.9rem; }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--header-bg);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-decoration: none;
            color: var(--text-color);
            cursor: pointer;
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-link {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .nav-link:hover { opacity: 0.7; }
        
        .theme-toggle {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        /* Search Bar */
        .search-container {
            position: relative;
            flex-grow: 1;
            max-width: 400px;
        }
        .search-input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background-color: var(--surface-color);
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: var(--text-muted);
        }
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 8px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            max-height: 400px;
            overflow-y: auto;
            z-index: 1000;
        }
        .search-result-item {
            display: flex;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.2s;
            gap: 12px;
        }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover { background-color: var(--border-color); }
        .search-result-poster {
            width: 40px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            background-color: var(--border-color);
        }
        .search-result-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .search-result-title { font-weight: 500; font-size: 0.95rem; }
        .search-result-meta { color: var(--text-muted); font-size: 0.8rem; text-transform: capitalize; }

        /* Main Layout */
        main {
            padding: 40px 0;
            min-height: calc(100vh - 70px);
        }

        /* Movie Detail View */
        .movie-detail {
            display: flex;
            gap: 40px;
            animation: fadeIn 0.3s ease;
        }
        @media (max-width: 768px) {
            .movie-detail { flex-direction: column; gap: 24px; }
        }
        .movie-poster-large {
            flex: 0 0 300px;
        }
        .movie-poster-large img {
            width: 100%;
            border-radius: 12px;
            box-shadow: var(--shadow);
            background-color: var(--border-color);
            min-height: 450px;
            object-fit: cover;
        }
        .movie-info-large {
            flex: 1;
        }
        .movie-title {
            font-size: 2.5rem;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }
        .movie-meta {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.95rem;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .movie-meta span { display: flex; align-items: center; }
        .movie-plot {
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 30px;
        }
        .movie-details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }
        .detail-item strong { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-item span { font-size: 0.95rem; }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.95rem;
            text-align: center;
        }
        .btn-primary {
            background-color: var(--accent-color);
            color: var(--btn-text);
        }
        .btn-primary:hover {
            background-color: var(--accent-hover);
        }
        .btn-outline {
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }
        .btn-outline:hover {
            border-color: var(--text-muted);
            background-color: var(--surface-color);
        }
        .btn-danger {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }
        .btn-danger:hover {
            background-color: var(--danger-color);
            color: #fff;
        }

        /* Review Section */
        .review-section {
            background-color: var(--surface-color);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .review-section h3 { margin-bottom: 15px; font-size: 1.2rem; }
        .star-rating {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .star {
            font-size: 1.5rem;
            color: var(--border-color);
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
        }
        .star:hover { transform: scale(1.1); }
        .star.active { color: var(--star-color); }
        
        .review-input {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
            margin-bottom: 15px;
            resize: vertical;
        }
        .review-input:focus { outline: none; border-color: var(--text-muted); }

        /* Watchlist View */
        .view-header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
        }
        .movie-card {
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }
        .movie-card:hover {
            transform: translateY(-4px);
        }
        .movie-card-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background-color: var(--border-color);
            box-shadow: var(--shadow);
        }
        .movie-card-title {
            font-weight: 500;
            font-size: 0.95rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-rating-badge {
            color: var(--star-color);
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loader {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <a href="#" id="logo" class="logo">Movie Rater.</a>
            
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search for a movie or series..." autocomplete="off">
                <div id="searchResults" class="search-results hidden"></div>
            </div>

            <div class="nav-actions">
                <a href="#" id="watchlistLink" class="nav-link">Watchlist</a>
                <button id="themeToggle" class="theme-toggle">☾ Dark</button>
            </div>
        </div>
    </header>

    <main id="app" class="container">
        <!-- Content gets injected here -->
    </main>

    <script>
        // --- State Management ---
        const state = {
            apiKey: '4a3b711b',
            watchlist: JSON.parse(localStorage.getItem('cinefile_watchlist')) || [],
            theme: localStorage.getItem('cinefile_theme') || 'light',
            view: 'home', // 'home', 'detail', 'watchlist'
            currentMovie: null,
            searchTimeout: null,
            tempRating: 0
        };

        // --- DOM Elements ---
        const els = {
            app: document.getElementById('app'),
            logo: document.getElementById('logo'),
            searchInput: document.getElementById('searchInput'),
            searchResults: document.getElementById('searchResults'),
            watchlistLink: document.getElementById('watchlistLink'),
            themeToggle: document.getElementById('themeToggle')
        };

        // --- Initialization ---
        function init() {
            applyTheme(state.theme);
            renderHome();
            setupEventListeners();
        }

        // --- Event Listeners ---
        function setupEventListeners() {
            els.themeToggle.addEventListener('click', () => {
                const newTheme = state.theme === 'light' ? 'dark' : 'light';
                state.theme = newTheme;
                localStorage.setItem('cinefile_theme', newTheme);
                applyTheme(newTheme);
            });

            els.searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                if (state.searchTimeout) clearTimeout(state.searchTimeout);
                
                if (query.length > 2) {
                    state.searchTimeout = setTimeout(() => performSearch(query), 300);
                } else {
                    els.searchResults.innerHTML = '';
                    els.searchResults.classList.add('hidden');
                }
            });

            // Close search results when clicking outside
            document.addEventListener('click', (e) => {
                if (!els.searchInput.contains(e.target) && !els.searchResults.contains(e.target)) {
                    els.searchResults.classList.add('hidden');
                }
            });

            els.logo.addEventListener('click', (e) => {
                e.preventDefault();
                els.searchInput.value = '';
                els.searchResults.classList.add('hidden');
                renderHome();
            });

            els.watchlistLink.addEventListener('click', (e) => {
                e.preventDefault();
                els.searchInput.value = '';
                els.searchResults.classList.add('hidden');
                renderWatchlist();
            });
        }

        // --- API & Data ---
        async function fetchOMDb(params) {
            try {
                const url = new URL('https://www.omdbapi.com/');
                url.searchParams.append('apikey', state.apiKey);
                for (const key in params) {
                    url.searchParams.append(key, params[key]);
                }
                const res = await fetch(url);
                const data = await res.json();
                if (data.Response === "False") throw new Error(data.Error);
                return data;
            } catch (err) {
                console.error(err);
                return { error: err.message };
            }
        }

        async function performSearch(query) {
            const data = await fetchOMDb({ s: query });
            els.searchResults.innerHTML = '';
            
            if (data.error) {
                els.searchResults.innerHTML = `<div class="p-3 text-muted" style="padding:15px">${data.error}</div>`;
                els.searchResults.classList.remove('hidden');
                return;
            }

            if (data.Search && data.Search.length > 0) {
                const resultsHtml = data.Search.slice(0, 6).map(movie => `
                    <div class="search-result-item" onclick="openDetail('${movie.imdbID}')">
                        <img src="${movie.Poster !== 'N/A' ? movie.Poster : 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iNDUwIiBmaWxsPSIjZWVlIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIi8+PC9zdmc+'}" class="search-result-poster" alt="Poster">
                        <div class="search-result-info">
                            <div class="search-result-title">${movie.Title}</div>
                            <div class="search-result-meta">${movie.Year} • ${movie.Type}</div>
                        </div>
                    </div>
                `).join('');
                els.searchResults.innerHTML = resultsHtml;
                els.searchResults.classList.remove('hidden');
            }
        }

        window.openDetail = async function(imdbID) {
            els.searchResults.classList.add('hidden');
            els.searchInput.value = '';
            els.app.innerHTML = '<div class="loader"></div>';
            
            const data = await fetchOMDb({ i: imdbID, plot: 'full' });
            if (!data.error) {
                state.currentMovie = data;
                state.tempRating = getWatchlistItem(imdbID)?.userRating || 0;
                renderDetail();
            } else {
                els.app.innerHTML = `<div class="empty-state"><p>Error loading movie details.</p></div>`;
            }
        };

        // --- Rendering ---
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            els.themeToggle.textContent = theme === 'light' ? '☾ Dark' : '☀ Light';
        }

        function renderHome() {
            state.view = 'home';
            els.app.innerHTML = `
                <div class="empty-state" style="margin-top:10vh;">
                    <h1 style="font-size:3rem; margin-bottom:1rem; font-weight:700; letter-spacing:-1px; color:var(--text-color);">Discover Cinema.</h1>
                    <p style="font-size:1.15rem; max-width:600px; margin:0 auto; color:var(--text-muted);">Search for any movie or series to view details, save them to your watchlist, and leave your personal ratings.</p>
                </div>
            `;
            
            if (state.watchlist.length > 0) {
                const recent = state.watchlist.slice().reverse().slice(0, 5);
                els.app.innerHTML += `
                    <div style="margin-top:60px;">
                        <h3 style="margin-bottom:20px; font-weight:600;">Recently Added</h3>
                        <div class="movie-grid">
                            ${recent.map(m => generateMovieCard(m)).join('')}
                        </div>
                    </div>
                `;
            }
        }

        function renderDetail() {
            state.view = 'detail';
            const m = state.currentMovie;
            const watchlistItem = getWatchlistItem(m.imdbID);
            const inWatchlist = !!watchlistItem;
            const posterSrc = m.Poster !== 'N/A' ? m.Poster : 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iNDUwIiBmaWxsPSIjZWVlIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIi8+PC9zdmc+';
            
            const rtRating = m.Ratings && m.Ratings.find(r => r.Source === "Rotten Tomatoes");
            
            els.app.innerHTML = `
                <div class="movie-detail">
                    <div class="movie-poster-large">
                        <img src="${posterSrc}" alt="${m.Title}">
                    </div>
                    <div class="movie-info-large">
                        <h1 class="movie-title">${m.Title}</h1>
                        <div class="movie-meta" style="margin-bottom: 12px; font-weight: 500; font-size: 1.05rem;">
                            <span>Directed by ${m.Director}</span>
                        </div>
                        <div class="movie-meta">
                            <span>${m.Year}</span>
                            <span>${m.Runtime !== 'N/A' ? m.Runtime : ''}</span>
                            <span>${m.Rated !== 'N/A' ? m.Rated : ''}</span>
                            <span>${m.Genre}</span>
                        </div>
                        
                        <div class="action-buttons">
                            <button id="toggleWatchlistBtn" class="btn ${inWatchlist ? 'btn-danger' : 'btn-primary'}">
                                ${inWatchlist ? 'Remove from Watchlist' : '+ Add to Watchlist'}
                            </button>
                        </div>

                        <div class="movie-plot">${m.Plot}</div>

                        <div class="movie-details-grid">
                            <div class="detail-item"><strong>Director</strong><span>${m.Director}</span></div>
                            <div class="detail-item"><strong>Writers</strong><span>${m.Writer}</span></div>
                            <div class="detail-item"><strong>Cast</strong><span>${m.Actors}</span></div>
                            <div class="detail-item"><strong>Language</strong><span>${m.Language}</span></div>
                            <div class="detail-item"><strong>Awards</strong><span>${m.Awards}</span></div>
                            <div class="detail-item">
                                <strong>Ratings</strong>
                                <span style="display:block">IMDb: ${m.imdbRating !== 'N/A' ? m.imdbRating + '/10' : 'N/A'}</span>
                                ${rtRating ? `<span style="display:block">Rotten Tomatoes: ${rtRating.Value}</span>` : ''}
                            </div>
                        </div>

                        <div class="review-section">
                            <h3>Your Review</h3>
                            <div class="star-rating" id="starRating">
                                ${[1,2,3,4,5].map(i => `<span class="star ${i <= state.tempRating ? 'active' : ''}" data-val="${i}">★</span>`).join('')}
                            </div>
                            <textarea id="reviewText" class="review-input" placeholder="Write your thoughts...">${watchlistItem?.userReview || ''}</textarea>
                            <button id="saveReviewBtn" class="btn btn-outline">Save Review</button>
                            <span id="saveFeedback" style="margin-left:10px; color:var(--text-muted); font-size:0.9rem; opacity:0; transition:opacity 0.3s;">Saved!</span>
                        </div>
                    </div>
                </div>
            `;

            // Bind Detail Events
            document.getElementById('toggleWatchlistBtn').addEventListener('click', toggleWatchlist);
            
            const stars = document.querySelectorAll('.star');
            stars.forEach(star => {
                star.addEventListener('mouseover', (e) => {
                    const val = parseInt(e.target.dataset.val);
                    stars.forEach(s => {
                        if (parseInt(s.dataset.val) <= val) s.style.color = 'var(--star-color)';
                        else s.style.color = 'var(--border-color)';
                    });
                });
                star.addEventListener('mouseout', () => {
                    stars.forEach(s => s.style.color = '');
                });
                star.addEventListener('click', (e) => {
                    const val = parseInt(e.target.dataset.val);
                    state.tempRating = val;
                    updateStars(val);
                });
            });

            document.getElementById('saveReviewBtn').addEventListener('click', () => {
                const text = document.getElementById('reviewText').value;
                saveReview(state.tempRating, text);
                const feedback = document.getElementById('saveFeedback');
                feedback.style.opacity = 1;
                setTimeout(() => feedback.style.opacity = 0, 2000);
            });
        }

        function updateStars(rating) {
            document.querySelectorAll('.star').forEach(star => {
                if (parseInt(star.dataset.val) <= rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function renderWatchlist() {
            state.view = 'watchlist';
            if (state.watchlist.length === 0) {
                els.app.innerHTML = `
                    <div class="view-header">
                        <h2 style="font-size:2rem; font-weight:600;">Your Watchlist</h2>
                    </div>
                    <div class="empty-state">
                        <p>Your watchlist is empty.</p>
                        <p style="margin-top:10px;">Use the search bar above to find movies to add.</p>
                    </div>
                `;
                return;
            }

            els.app.innerHTML = `
                <div class="view-header">
                    <h2 style="font-size:2rem; font-weight:600;">Your Watchlist <span class="text-muted" style="font-size:1.2rem; font-weight:400;">(${state.watchlist.length})</span></h2>
                </div>
                <div class="movie-grid">
                    ${state.watchlist.map(m => generateMovieCard(m)).join('')}
                </div>
            `;
        }

        function generateMovieCard(m) {
            const posterSrc = m.Poster !== 'N/A' ? m.Poster : 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iNDUwIiBmaWxsPSIjZWVlIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIi8+PC9zdmc+';
            let ratingBadge = '';
            if (m.userRating > 0) {
                ratingBadge = `<div class="user-rating-badge">★ ${m.userRating}</div>`;
            }
            
            return `
                <div class="movie-card" onclick="openDetail('${m.imdbID}')">
                    <img src="${posterSrc}" alt="${m.Title}" class="movie-card-poster">
                    <div class="movie-card-title">${m.Title}</div>
                    ${m.Director ? `<div class="text-muted" style="font-size:0.85rem; margin-bottom:4px;">Dir. ${m.Director}</div>` : ''}
                    <div class="movie-card-meta">
                        <span class="text-muted" style="font-size:0.85rem">${m.Year}</span>
                        ${ratingBadge}
                    </div>
                </div>
            `;
        }

        // --- Data Mutations ---
        function getWatchlistItem(imdbID) {
            return state.watchlist.find(i => i.imdbID === imdbID);
        }

        function toggleWatchlist() {
            const m = state.currentMovie;
            const existingIndex = state.watchlist.findIndex(i => i.imdbID === m.imdbID);
            
            if (existingIndex >= 0) {
                // Remove
                state.watchlist.splice(existingIndex, 1);
            } else {
                // Add
                state.watchlist.push({
                    imdbID: m.imdbID,
                    Title: m.Title,
                    Year: m.Year,
                    Poster: m.Poster,
                    Type: m.Type,
                    Director: m.Director,
                    userRating: state.tempRating || 0,
                    userReview: document.getElementById('reviewText') ? document.getElementById('reviewText').value : ''
                });
            }
            
            saveWatchlist();
            renderDetail(); // Re-render to update button state
        }

        function saveReview(rating, reviewText) {
            const m = state.currentMovie;
            const existing = getWatchlistItem(m.imdbID);
            
            if (existing) {
                existing.userRating = rating;
                existing.userReview = reviewText;
            } else {
                state.watchlist.push({
                    imdbID: m.imdbID,
                    Title: m.Title,
                    Year: m.Year,
                    Poster: m.Poster,
                    Type: m.Type,
                    Director: m.Director,
                    userRating: rating,
                    userReview: reviewText
                });
                renderDetail(); // Update button since it was just added
            }
            saveWatchlist();
        }

        function saveWatchlist() {
            localStorage.setItem('cinefile_watchlist', JSON.stringify(state.watchlist));
        }

        // Boot
        init();
    </script>
</body>
</html>
